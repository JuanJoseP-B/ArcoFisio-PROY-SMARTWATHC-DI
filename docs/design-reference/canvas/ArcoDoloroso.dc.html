<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Arco doloroso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Roboto Flex",system-ui,sans-serif;color:#1F3A2B}
.bezel{width:384px;height:384px;border-radius:50%;background:#000;padding:12px;box-shadow:0 0 0 3px #9A9C9A,0 18px 40px rgba(31,58,43,.25)}
.screen{position:relative;width:384px;height:384px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#F8EEDD 0%,#EBD6B0 100%);overflow:hidden}
.glass{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.55),rgba(255,255,255,0) 42%);pointer-events:none}
.layer{position:absolute;left:0;top:0}
.chip{transition:background-color 90ms,color 90ms}
.band{animation:band 1600ms ease-in-out infinite}
@keyframes band{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</helmet>
<div style="width: 440px; height: 440px; display: flex; align-items: center; justify-content: center; background: #E9DCC4">
<div class="bezel">
<div class="screen">
<svg class="layer" style="position:absolute;left:0;top:0" width="384" height="384" viewBox="0 0 384 384" aria-hidden="true"><g opacity="0.11"><g transform="rotate(-64 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g><g transform="rotate(-48 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g><g transform="rotate(-32 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g><g transform="rotate(-16 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g><g transform="rotate(0 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g><g transform="rotate(16 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g><g transform="rotate(32 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g><g transform="rotate(48 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g><g transform="rotate(64 192 384)"><path d="M192 384 Q174 250 192 96 Q210 250 192 384 Z" fill="#7A4E14"></path><path d="M192 384 L192 110" stroke="#F6EBD9" stroke-width="1.5"></path><path d="M183 140 Q192 112 201 140 Q192 128 183 140 Z" fill="#2A1C12"></path></g></g></svg>
<svg class="layer" width="384" height="384" viewBox="0 0 384 384" aria-hidden="true">
<circle class="band" cx="192" cy="192" r="164" fill="none" stroke="#F4D3C8" stroke-width="30" stroke-dasharray="114.49 1030.44" stroke-dashoffset="-200.36" transform="rotate(-90 192 192)"></circle>
<circle cx="192" cy="192" r="164" fill="none" stroke="#E3CA9C" stroke-width="14"></circle>
<circle cx="192" cy="192" r="164" fill="none" stroke="#1F3A2B" stroke-width="14" stroke-linecap="round" stroke-dasharray="1030.44" stroke-dashoffset="{{off}}" transform="rotate(-90 192 192)"></circle>
<circle cx="192" cy="192" r="164" fill="none" stroke="#A3392D" stroke-width="14" stroke-dasharray="{{painDash}}" stroke-dashoffset="-200.36" transform="rotate(-90 192 192)"></circle>
<g transform="rotate(70 192 192)"><line x1="192" y1="10" x2="192" y2="46" stroke="#A3392D" stroke-width="2"></line></g>
<g transform="rotate(110 192 192)"><line x1="192" y1="10" x2="192" y2="46" stroke="#A3392D" stroke-width="2"></line></g>
<g transform="rotate({{a}} 192 192)">
<circle cx="192" cy="28" r="12" fill="{{knobFill}}" stroke="{{knobStroke}}" stroke-width="3"></circle>
<path d="M 189 23 L 195 28 L 189 33" fill="none" stroke="{{knobStroke}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
</g>
</svg>
<div class="layer" style="width: 384px; height: 384px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<div style="font-size: 13px; line-height: 16px; font-weight: 500; color: #5C5140">Abducción</div>
<div style="font-size: 72px; line-height: 72px; font-weight: 600; font-variant-numeric: tabular-nums">{{deg}}°</div>
<div class="chip" style="padding: 6px 14px; border-radius: 999px; font-size: 13px; line-height: 16px; font-weight: 500; background: {{chipBg}}; color: {{chipFg}}">{{chipTxt}}</div>
</div>
<div class="glass"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":440}}'>
class Component extends DCLogic {
componentDidMount() { this.t0 = Date.now(); this.iv = setInterval(() => this.forceUpdate(), 33); }
componentWillUnmount() { clearInterval(this.iv); }
renderVals() {
  const C = 1030.44;
  const t = ((Date.now() - (this.t0 || Date.now())) % 7000) / 7000;
  const s = (x) => x * x * (3 - 2 * x);
  let a = 0;
  if (t < .45) a = 150 * s(t / .45);
  else if (t < .55) a = 150;
  else if (t < .95) a = 150 * (1 - s((t - .55) / .4));
  const inPain = a > 70 && a < 110;
  const shown = inPain ? a + Math.sin(Date.now() / 28) * 1.6 : a;
  const pl = Math.max(0, Math.min(a, 110) - 70) / 360 * C;
  return {
    a: shown.toFixed(2),
    off: (C * (1 - a / 360)).toFixed(2),
    painDash: pl.toFixed(2) + ' ' + C,
    deg: Math.round(a),
    knobFill: inPain ? '#F4D3C8' : '#EDD9B4',
    knobStroke: inPain ? '#A3392D' : '#1F3A2B',
    chipBg: inPain ? '#F4D3C8' : '#DDE7CF',
    chipFg: inPain ? '#A3392D' : '#2F6B3F',
    chipTxt: inPain ? 'Dolor · 70–110°' : 'Sin dolor'
  };
}
}
</script>
</body>
</html>
