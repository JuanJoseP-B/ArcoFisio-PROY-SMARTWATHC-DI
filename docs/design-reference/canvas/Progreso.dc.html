<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Progreso por pasos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Roboto Flex",system-ui,sans-serif;color:#1F3A2B}
.bezel{width:384px;height:384px;border-radius:50%;background:#000;padding:12px;box-shadow:0 0 0 3px #9A9C9A,0 18px 40px rgba(31,58,43,.25)}
.screen{position:relative;width:384px;height:384px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#F8EEDD 0%,#EBD6B0 100%);overflow:hidden}
.glass{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.55),rgba(255,255,255,0) 42%);pointer-events:none}
.layer{position:absolute;left:0;top:0}
.seg{transition:stroke 180ms}
.pill{height:8px;border-radius:999px;transition:width 300ms cubic-bezier(.2,0,0,1),background-color 300ms}
</style>
</helmet>
<div style="width: 440px; height: 440px; display: flex; align-items: center; justify-content: center; background: #E9DCC4">
<div class="bezel">
<div class="screen">
<svg class="layer" style="position:absolute;left:0;top:0" width="384" height="384" viewBox="0 0 384 384" aria-hidden="true"><defs><pattern id="ar1" patternUnits="userSpaceOnUse" width="56" height="56" patternTransform="rotate(-35)"><line x1="6" y1="28" x2="44" y2="28" stroke="#7A4E14" stroke-width="2"></line><path d="M50 28 L42 23 L44 28 L42 33 Z" fill="#7A4E14"></path><path d="M6 28 L1 24 M6 28 L1 32 M11 28 L6 24 M11 28 L6 32" stroke="#B5532F" stroke-width="1.5"></path></pattern></defs><rect x="0" y="0" width="384" height="384" fill="url(#ar1)" opacity="0.10"></rect></svg>
<svg class="layer" width="384" height="384" viewBox="0 0 384 384" aria-hidden="true">
<sc-for list="{{segs}}" as="sg" hint-placeholder-count="10">
<circle class="seg" cx="192" cy="192" r="164" fill="none" stroke="{{sg.c}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="85.3 1030.44" stroke-dashoffset="{{sg.off}}" transform="rotate(-90 192 192)"></circle>
</sc-for>
<g transform="rotate({{am}} 192 192)" opacity="{{aop}}">
<line x1="192" y1="{{ay1}}" x2="192" y2="{{ay2}}" stroke="#1F3A2B" stroke-width="3" stroke-linecap="round"></line>
<path d="M 192 {{ah}} l -6 10 l 6 -3 l 6 3 Z" fill="#1F3A2B"></path>
<path d="M 186 {{af}} l 6 -6 l 6 6" fill="none" stroke="#C8902E" stroke-width="2.5" stroke-linecap="round"></path>
</g>
</svg>
<div class="layer" style="width: 384px; height: 384px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<div style="font-size: 13px; line-height: 16px; font-weight: 500; color: #5C5140">Repeticiones</div>
<div style="font-size: 72px; line-height: 72px; font-weight: 600; font-variant-numeric: tabular-nums">{{n}}<span style="font-size: 32px; color: #5C5140">/10</span></div>
<div style="display: flex; gap: 6px; align-items: center; margin-top: 4px">
<div class="pill" style="width: 28px; background: #1F3A2B"></div>
<div class="pill" style="width: 44px; background: #C8902E"></div>
<div class="pill" style="width: 28px; background: #E3CA9C"></div>
</div>
<div style="font-size: 11px; line-height: 14px; font-weight: 500; color: #7A4E14">Serie 2 de 3</div>
</div>
<div class="glass"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":440}}'>
class Component extends DCLogic {
componentDidMount() { this.t0 = Date.now(); this.iv = setInterval(() => this.forceUpdate(), 33); }
componentWillUnmount() { clearInterval(this.iv); }
renderVals() {
  const C = 1030.44, step = 700, cycle = 13;
  const el = Date.now() - (this.t0 || Date.now());
  const k = Math.floor(el / step) % cycle;
  const p = (el % step) / step;
  const flying = k < 10;
  const n = flying ? k + (p > .55 ? 1 : 0) : 10;
  const segs = [];
  for (let i = 0; i < 10; i++) {
    const start = i * 36 + 4;
    segs.push({ off: (-C * start / 360).toFixed(2), c: i < n ? (i === n - 1 && flying ? '#C8902E' : '#1F3A2B') : '#E3CA9C' });
  }
  const e = 1 - Math.pow(1 - Math.min(p / .55, 1), 3);
  const r0 = 60 + 86 * e;
  return {
    segs, n,
    am: (k * 36 + 20).toFixed(1),
    aop: flying && p < .6 ? 1 : 0,
    ay1: (192 - r0 + 30).toFixed(1), ay2: (192 - r0 + 6).toFixed(1),
    ah: (192 - r0).toFixed(1), af: (192 - r0 + 34).toFixed(1)
  };
}
}
</script>
</body>
</html>
